<!DOCTYPE html>
<html>
<head>
    <title>Gemini Chatbot</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 30px auto; }
        #chat-window { height: 400px; border: 1px solid #ccc; overflow-y: scroll;
                       padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .user-message { text-align: right; color: #1a73e8; margin: 6px 0; }
        .bot-message  { text-align: left;  color: #0f9d58; margin: 6px 0; }
        #user-input { width: 78%; padding: 6px; }
        #send-button { padding: 6px 12px; }
    </style>
</head>
<body>
    <h1>Chat with Gemini</h1>
    <div id="chat-window"></div>
    <input type="text" id="user-input" placeholder="Type your message...">
    <button id="send-button">Send</button>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput  = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const csrftoken  = '{{ csrf_token }}';

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = sender + '-message';
            div.textContent = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        sendButton.addEventListener('click', async () => {
            const message = userInput.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            userInput.value = '';

            try {
                const response = await fetch('/chat/ask/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken,
                    },
                    body: JSON.stringify({ message: message }),
                });
                const data = await response.json();
                addMessage(data.reply || data.error || 'No reply', 'bot');
            } catch (err) {
                addMessage('Network error: ' + err.message, 'bot');
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendButton.click();
        });
    </script>
</body>
</html>
